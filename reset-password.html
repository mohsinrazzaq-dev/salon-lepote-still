<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nova lozinka | Salon Lepote Still</title>
  <link rel="icon" href="images/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#faf7f7,#f3e8e6);font-family:Arial,Helvetica,sans-serif;color:#292322;padding:20px}
    .card{width:100%;max-width:460px;background:#fff;padding:40px;border:1px solid #ead8d3;border-radius:14px;box-shadow:0 22px 70px rgba(82,52,48,.12)}
    .logo{width:92px;height:92px;object-fit:contain;display:block;margin:0 auto 18px}
    .eyebrow{text-align:center;letter-spacing:4px;font-size:11px;font-weight:800;color:#9d625d;margin-bottom:9px}
    h1{text-align:center;margin:0 0 10px;font:600 36px/1.1 Georgia,serif;color:#292322}
    .description{text-align:center;color:#716865;line-height:1.65;margin:0 0 28px;font-size:14px}
    label{display:block;font-size:12px;font-weight:800;color:#625a57;margin:15px 0}
    input{width:100%;margin-top:7px;padding:14px;border:1px solid #dbc5c0;border-radius:6px;font-size:16px;outline:none;background:#fff}
    input:focus{border-color:#9d625d;box-shadow:0 0 0 3px rgba(157,98,93,.1)}
    button{width:100%;border:0;padding:14px;border-radius:6px;background:#9d625d;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}
    button:hover{background:#7b4f4a}
    button:disabled{opacity:.6;cursor:not-allowed}
    #message{text-align:center;margin:18px 0 0;line-height:1.55;font-size:13px}
    .success{color:#27734d}.error{color:#b33a3a}
    .back{display:block;text-align:center;margin-top:20px;color:#9d625d;text-decoration:none;font-size:12px;font-weight:700}
    .loading{text-align:center;color:#716865;font-size:13px;padding:10px 0}
  </style>
</head>
<body>
  <main class="card">
    <img src="images/logo.webp" alt="Salon Lepote Still" class="logo">
    <div class="eyebrow">ADMIN PANEL</div>
    <h1>Nova lozinka</h1>
    <p id="description" class="description">Proveravamo vaš sigurni link za resetovanje lozinke…</p>

    <div id="loading" class="loading">Molimo sačekajte…</div>

    <form id="resetForm" class="hidden">
      <label>Nova lozinka
        <input id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="Nova lozinka">
      </label>
      <label>Ponovite lozinku
        <input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="Ponovite lozinku">
      </label>
      <button id="saveBtn" type="submit">Sačuvaj novu lozinku</button>
    </form>

    <p id="message"></p>
    <a href="admin/" class="back">← Nazad na admin prijavu</a>
  </main>

  <script>
    const config = window.SALON_CONFIG || {};
    const message = document.getElementById('message');
    const loading = document.getElementById('loading');
    const form = document.getElementById('resetForm');
    const description = document.getElementById('description');
    const saveBtn = document.getElementById('saveBtn');

    if (!config.supabaseUrl || !config.supabaseAnonKey || !window.supabase) {
      showError('Supabase konfiguracija nije dostupna.');
    }

    const client = window.supabase?.createClient(config.supabaseUrl, config.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let recoveryReady = false;

    function showError(text) {
      loading.classList.add('hidden');
      form.classList.add('hidden');
      message.textContent = text;
      message.className = 'error';
    }

    function enableRecovery() {
      if (recoveryReady) return;
      recoveryReady = true;
      loading.classList.add('hidden');
      form.classList.remove('hidden');
      description.textContent = 'Unesite novu lozinku za vaš admin nalog.';
      message.textContent = '';
      message.className = '';
      document.getElementById('password').focus();
    }

    async function initialiseRecovery() {
      if (!client) return;

      const { data, error } = await client.auth.getSession();
      if (error) {
        showError('Link za resetovanje nije validan ili je istekao.');
        return;
      }

      if (data.session) {
        enableRecovery();
        return;
      }

      // Supabase may still be exchanging the recovery code from the URL.
      setTimeout(async () => {
        if (recoveryReady) return;
        const { data: retry } = await client.auth.getSession();
        if (retry.session) enableRecovery();
        else showError('Link za resetovanje nije validan ili je istekao. Zatražite novi link iz Admin Panela.');
      }, 2500);
    }

    if (client) {
      client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) enableRecovery();
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      message.textContent = '';
      message.className = '';

      if (password.length < 6) {
        message.textContent = 'Lozinka mora imati najmanje 6 karaktera.';
        message.className = 'error';
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = 'Lozinke se ne podudaraju.';
        message.className = 'error';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Čuvanje…';

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Sačuvaj novu lozinku';
        message.textContent = 'Promena lozinke nije uspela: ' + error.message;
        message.className = 'error';
        return;
      }

      message.textContent = 'Lozinka je uspešno promenjena. Preusmeravamo vas na Admin Panel…';
      message.className = 'success';
      form.classList.add('hidden');
      description.textContent = 'Vaša nova lozinka je sačuvana.';
      setTimeout(() => { window.location.href = 'admin/'; }, 1800);
    });

    initialiseRecovery();
  </script>
</body>
</html>
