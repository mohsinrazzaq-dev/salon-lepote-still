<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Reset Password | Salon Lepote Still</title>

  <link rel="icon" href="images/favicon.ico">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf7f7;
      font-family: Arial, sans-serif;
      color: #27243b;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
    }

    .eyebrow {
      text-align: center;
      letter-spacing: 4px;
      font-size: 12px;
      font-weight: 700;
      color: #9a6c91;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-family: Georgia, serif;
      font-size: 36px;
    }

    .description {
      text-align: center;
      color: #777;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #c98f8a;
    }

    button {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 10px;
      background: #9a6c91;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: .92;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }

    .success {
      color: #27734d;
    }

    .error {
      color: #b33a3a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9a6c91;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      src="images/logo.webp"
      alt="Salon Lepote Still"
      class="logo"
    >

    <div class="eyebrow">ADMIN PANEL</div>

    <h1>Nova lozinka</h1>

    <p class="description">
      Unesite novu lozinku za vaš admin nalog.
    </p>

    <form id="resetForm">

      <label>
        Nova lozinka
        <input
          id="password"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
          placeholder="Nova lozinka"
        >
      </label>

      <label>
        Ponovite lozinku
        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
          placeholder="Ponovite lozinku"
        >
      </label>

      <button type="submit">
        Sačuvaj novu lozinku
      </button>

    </form>

    <p id="message"></p>

    <a href="admin/" class="back">
      ← Nazad na admin prijavu
    </a>

  </main>

  <script>
    const config = window.SALON_CONFIG || {};

    const supabase = window.supabase.createClient(
      config.supabaseUrl,
      config.supabaseAnonKey
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    async function checkSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Link za resetovanje lozinke je istekao ili nije validan.";
        message.className = "error";
        form.style.display = "none";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.textContent = "";
      message.className = "";

      if (password !== confirmPassword) {
        message.textContent = "Lozinke se ne podudaraju.";
        message.className = "error";
        return;
      }

      if (password.length < 6) {
        message.textContent =
          "Lozinka mora imati najmanje 6 karaktera.";
        message.className = "error";
        return;
      }

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent =
          "Promena lozinke nije uspela: " + error.message;
        message.className = "error";
        return;
      }

      message.textContent =
        "Lozinka je uspešno promenjena. Sada možete da se prijavite u admin panel.";

      message.className = "success";

      form.style.display = "none";

      setTimeout(() => {
        window.location.href = "admin/";
      }, 2500);
    });

    checkSession();
  </script>

</body>
</html>
