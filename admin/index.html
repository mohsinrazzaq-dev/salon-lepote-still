<!doctype html>
<html lang="sr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin | Salon Lepote Still</title>
  <link rel="icon" href="../images/favicon.ico">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
</head>

<body>
  <div class="admin-shell">
    <section id="loginView" class="auth-card">
      <img src="../images/logo.webp" alt="Salon Lepote Still">
      <p class="eyebrow">ADMIN PANEL</p>
      <h1>Salon Lepote Still</h1>
      <p>Upravljajte cenama i uslugama.</p>
      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>Lozinka<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Prijava</button>
        <p id="loginMessage" class="message"></p>
        <a href="#" id="forgotPasswordLink" class="forgot-password">
          Zaboravili ste lozinku?
        </a>

        <div id="resetBox" class="reset-box hidden">
          <p>Unesite email adresu admin naloga. Poslaćemo vam link za promenu lozinke.</p>

          <form id="resetForm">
            <input id="resetEmail" type="email" placeholder="Email adresa" autocomplete="email" required>

            <button class="primary" type="submit">
              Pošalji link za resetovanje
            </button>

            <p id="resetMessage" class="message"></p>
          </form>
        </div>
      </form>
    </section>

    <section id="appView" class="app hidden">
      <header class="app-header">
        <div>
          <p class="eyebrow">ADMIN PANEL</p>
          <h1>Cenovnik</h1>
        </div>
        <div class="header-actions"><a href="../" target="_blank" rel="noopener">Otvori sajt ↗</a><button id="logoutBtn"
            class="ghost">Odjava</button></div>
      </header>
      <div id="setupNotice" class="notice hidden"></div>
      <div class="stats">
        <div><strong id="serviceCount">0</strong><span>Usluga</span></div>
        <div><strong id="categoryCount">0</strong><span>Kategorija</span></div>
        <div><strong>RSD</strong><span>Valuta</span></div>
      </div>
      <div class="toolbar"><input id="searchInput" placeholder="Pretraži usluge..." aria-label="Pretraži usluge"><button
          id="addBtn" class="primary">+ Dodaj uslugu</button></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Usluga</th>
              <th>Kategorija</th>
              <th>Cena</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="serviceTable"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button id="modalClose" class="modal-close" aria-label="Zatvori">×</button>
      <p class="eyebrow">USLUGA</p>
      <h2 id="modalTitle">Dodaj uslugu</h2>
      <form id="serviceForm">
        <input id="serviceId" type="hidden">
        <label>Naziv usluge<input id="serviceName" required></label>
        <label>Kategorija<input id="serviceCategory" list="categories" required><datalist
            id="categories"></datalist></label>
        <div class="two"><label>Minimalna cena<input id="priceMin" type="number" min="0" step="1"
              required></label><label>Maksimalna cena<input id="priceMax" type="number" min="0" step="1"
              required></label></div>
        <label>Valuta<input id="currency" value="RSD" maxlength="8" required></label>
        <label class="switch"><input id="active" type="checkbox" checked><span>Prikaži na sajtu</span></label>
        <button class="primary" type="submit">Sačuvaj</button>
        <p id="formMessage" class="message"></p>
      </form>
    </div>
  </div>
  <script src="admin.js"></script>
</body>

</html>
